<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d65b4"/>
      <stop offset="1" stop-color="#062a57"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset=".35" stop-color="#f6bf35"/>
      <stop offset="1" stop-color="#9a5b00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="260" fill="#ffffff" opacity=".06"/>
  <circle cx="180" cy="760" r="280" fill="#ffffff" opacity=".05"/>
  <path d="M0 760 Q240 700 430 760 T820 760 T1200 760 T1600 760 V900 H0Z" fill="#ffffff" opacity=".06"/>
  <path d="M0 825 Q260 760 520 820 T1040 810 T1600 825 V900 H0Z" fill="#f6bf35" opacity=".12"/>

  <g transform="translate(90 90)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-family="Arial, sans-serif" font-weight="700">MUNICIPALIDAD DISTRITAL DE PUCYURA</text>
    <text x="0" y="58" fill="#d7efff" font-size="24" font-family="Arial, sans-serif">Programa General de Festejos · 2026</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="230" width="650" height="460" rx="30" fill="#ffffff"/>
    <image href="assets/pages/page_01.jpg" x="145" y="255" width="600" height="410" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g transform="translate(880 250)">
    <text x="0" y="0" fill="url(#gold)" font-size="130" font-family="Arial, sans-serif" font-weight="900">84</text>
    <text x="0" y="76" fill="#ffffff" font-size="58" font-family="Arial, sans-serif" font-weight="800">ANIVERSARIO</text>
    <text x="0" y="135" fill="#d9ecff" font-size="28" font-family="Arial, sans-serif">PUCYURA 2026</text>
    <text x="0" y="205" fill="#ffffff" font-size="24" font-family="Arial, sans-serif">Tierra del Sol y el Agua más Pura del Mundo</text>
    <rect x="0" y="255" width="420" height="82" rx="41" fill="#f0b429"/>
    <text x="210" y="307" text-anchor="middle" fill="#062a57" font-size="28" font-family="Arial, sans-serif" font-weight="900">ABRIR REVISTA</text>
  </g>

  <text x="90" y="840" fill="#ffffff" opacity=".9" font-size="24" font-family="Arial, sans-serif">Ununchis Rayku</text>
